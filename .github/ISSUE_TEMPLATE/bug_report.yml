name: Bug report
description: Create a report to help us improve.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please omit secrets, tokens, and private paths.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: To reproduce
      description: Steps to reproduce the behavior, including the command, the configuration, and the output.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS, Linux, or Windows
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version
      placeholder: 1.22
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: git-scars version or commit
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that would help, with private tokens and keys removed.
    validations:
      required: false
