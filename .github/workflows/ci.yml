name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Verify code formatting
        run: |
          diffs=$(gofmt -l .)
          if [ -n "$diffs" ]; then
            echo "The following files are not formatted with gofmt:"
            echo "$diffs"
            exit 1
          fi

      - name: Verify vet, test, and build
        run: |
          if [ -f "go.mod" ]; then
            go vet ./...
            go test -v -race ./...
            go build -v ./...
          else
            echo "No go.mod present yet; skipping Go build and test steps."
          fi

      - name: Validate GitScars integrity and freshness
        run: |
          go build -o /tmp/git-scars ./cmd/git-scars
          /tmp/git-scars lint
          /tmp/git-scars check
          /tmp/git-scars doctor

