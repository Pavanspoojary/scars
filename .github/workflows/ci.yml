name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          check-latest: true

      - name: Verify code formatting
        run: |
          diffs=$(gofmt -l .)
          if [ -n "$diffs" ]; then
            echo "The following files are not formatted with gofmt:"
            echo "$diffs"
            exit 1
          fi

      - name: Verify vet, test, and build
        run: |
          if [ -f "go.mod" ]; then
            go vet ./...
            go test -v -race ./...
            go build -v ./...
          else
            echo "No go.mod present yet; skipping Go build and test steps."
          fi

      - name: Validate GitScars integrity and freshness
        run: |
          go build -o /tmp/git-scars ./cmd/git-scars
          /tmp/git-scars lint
          /tmp/git-scars check
          /tmp/git-scars doctor

      - name: Collect guardrail matches on changed files
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          go build -o /tmp/git-scars ./cmd/git-scars
          if [ -n "$BASE_SHA" ]; then
            git diff --name-only "$BASE_SHA...HEAD" > /tmp/changed.txt
          else
            git diff --name-only HEAD~1...HEAD > /tmp/changed.txt
          fi
          if [ -s /tmp/changed.txt ]; then
            set +e
            /tmp/git-scars enforce --files "$(cat /tmp/changed.txt)" --fail-on high --format sarif > git-scars.sarif
            STATUS=$?
            set -e
            if [ "$STATUS" -eq 2 ]; then
              echo "::warning::This change touches code covered by an active guardrail. Guardrail annotations are uploaded to this pull request. The build fails if a guardrailed symbol changed without a recorded review (git-scars reaffirm)."
            elif [ "$STATUS" -ne 0 ]; then
              echo "::error::git-scars enforce failed with exit code $STATUS"
              exit "$STATUS"
            fi
          fi

      - name: Collect freshness findings
        if: always()
        run: |
          go build -o /tmp/git-scars ./cmd/git-scars
          /tmp/git-scars check --format sarif > git-scars-check.sarif || true

      - name: Upload guardrail annotations
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('git-scars.sarif') != ''
        with:
          sarif_file: git-scars.sarif
          category: git-scars-guardrails

      - name: Upload freshness annotations
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('git-scars-check.sarif') != ''
        with:
          sarif_file: git-scars-check.sarif
          category: git-scars-freshness

